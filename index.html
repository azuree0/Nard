<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Nard</h1>
        </header>
        
        <div class="game-info">
            <div class="player-info">
                <div id="current-player" class="player-indicator">
                    <span>Current Player: </span>
                    <span id="player-name">White</span>
                </div>
                <div id="dice-display" class="dice-container">
                    <span>Dice: </span>
                    <div id="dice-values">
                        <span id="die1" class="die">-</span>
                        <span id="die2" class="die">-</span>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button id="roll-btn" class="btn btn-primary">Roll Dice</button>
                <button id="reset-btn" class="btn btn-secondary">Reset Game</button>
            </div>
        </div>
        
        <div id="board-container" class="board-container">
            <div id="game-board" class="board"></div>
        </div>
    
    <script type="module" src="index.js"></script>
</body>
</html>
